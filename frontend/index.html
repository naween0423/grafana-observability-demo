<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafana & Alloy Observability Demo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 40px; background-color: #f4f6f8; color: #333; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #111; }
        p { color: #666; line-height: 1.5; }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-info { background-color: #2563eb; color: white; }
        .btn-warn { background-color: #d97706; color: white; }
        .btn-error { background-color: #dc2626; color: white; }
        #log-output { margin-top: 20px; padding: 12px; background: #1e293b; color: #f8fafc; font-family: monospace; border-radius: 6px; min-height: 80px; font-size: 0.9rem; overflow-x: auto; }
    </style>
</head>
<body>

<div class="card">
    <h1>Observability Test Client</h1>
    <p>Click any button below to generate events. The logs will be posted to the Spring Boot backend, collected by <strong>Grafana Alloy</strong>, stored in <strong>Loki</strong>, and made viewable in <strong>Grafana</strong>.</p>

    <div class="btn-group">
        <button class="btn-info" onclick="sendLog('INFO', 'User initiated checkout process')">Log INFO</button>
        <button class="btn-warn" onclick="sendLog('WARN', 'Payment gateway response slow (1200ms)')">Log WARN</button>
        <button class="btn-error" onclick="sendLog('ERROR', 'Payment gateway timed out!')">Log ERROR</button>
    </div>

    <h3>Last Event Sent:</h3>
    <pre id="log-output">// Waiting for action...</pre>
</div>

<script>
    const API_ENDPOINT = 'http://localhost:8080/api/v1/logs';

    async function sendLog(level, message) {
        const payload = {
            level: level,
            message: message,
            appVersion: "1.0.0",
            userId: "usr_" + Math.floor(Math.random() * 90000 + 10000)
        };

        document.getElementById('log-output').innerText = "Sending: " + JSON.stringify(payload, null, 2);

        try {
            const res = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('log-output').innerText = "SUCCESS (" + res.status + "):
" + JSON.stringify(payload, null, 2);
            } else {
                document.getElementById('log-output').innerText = "ERROR (" + res.status + "): Failed to send";
            }
        } catch (err) {
            document.getElementById('log-output').innerText = "NETWORK ERROR: " + err.message;
        }
    }
</script>

</body>
</html>
